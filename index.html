<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raiders Clan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;overflow-x:hidden}
#loader{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s}
#loader.hidden{opacity:0;visibility:hidden}
#loader img{width:280px;height:280px;border-radius:50%;object-fit:cover;animation:pulse 1.5s infinite;box-shadow:0 0 80px rgba(255,174,0,.6)}
#loader h1{margin-top:30px;font-size:32px;letter-spacing:4px;color:#ffae00}
.bar{margin-top:20px;width:200px;height:4px;background:#222;border-radius:10px;overflow:hidden}
.progress{height:100%;background:linear-gradient(90deg,#ffae00,#ff3c00);animation:load 2.2s ease-in-out forwards}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes load{0%{width:0%}100%{width:100%}}
.header{text-align:center;padding:45px 20px 10px}
.header h1{font-size:48px;letter-spacing:6px;color:#ffae00;text-shadow:0 0 20px rgba(255,174,0,.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:720px;margin:30px auto;padding:0 20px}
.stat-card{background:linear-gradient(145deg,#1a1a1a,#111);border:1px solid #2a2a2a;border-radius:16px;padding:26px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.stat-card h2{font-size:42px;color:#ffae00;font-weight:800}
.stat-card p{margin-top:8px;letter-spacing:2px;text-transform:uppercase;color:#999;font-size:13px}
.divisions{margin-top:50px;background:#0f0f0f;padding:22px 0;border-top:1px solid #222;border-bottom:1px solid #222}
.divisions h3{text-align:center;letter-spacing:4px;margin-bottom:26px;font-size:16px}
.marquee{overflow:hidden;white-space:nowrap;position:relative}
.track{display:flex;gap:28px;animation:scroll 24s linear infinite;width:max-content}
.slide{width:140px;height:140px;border-radius:50%;overflow:hidden;border:2px solid #333;flex-shrink:0;background:#000}
.slide img{width:100%;height:100%;object-fit:cover}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee:hover .track{animation-play-state:paused}
</style>
</head>
<body>

<div id="loader">
<img src="raiders_main.jpg" alt="Raiders">
<h1>RAIDERS</h1>
<div class="bar"><div class="progress"></div></div>
</div>

<div class="header"><h1>RAIDERS CLAN</h1></div>

<div class="stats">
<div class="stat-card"><h2>27</h2><p>Member</p></div>
<div class="stat-card"><h2>4</h2><p>Raids</p></div>
<div class="stat-card"><h2>6</h2><p>Divisionen</p></div>
</div>

<div class="divisions">
<h3>UNSERE DIVISIONEN</h3>
<div class="marquee">
<div class="track">
<div class="slide"><img src="eh.jpg"></div>
<div class="slide"><img src="mc.jpg"></div>
<div class="slide"><img src="raiders_main.jpg"></div>
<div class="slide"><img src="sab.jpg"></div>
<div class="slide"><img src="roblox.jpg"></div>
<div class="slide"><img src="dc.jpg"></div>
<div class="slide"><img src="eh.jpg"></div>
<div class="slide"><img src="mc.jpg"></div>
<div class="slide"><img src="raiders_main.jpg"></div>
<div class="slide"><img src="sab.jpg"></div>
<div class="slide"><img src="roblox.jpg"></div>
<div class="slide"><img src="dc.jpg"></div>
</div>
</div>
</div>

<script>
window.addEventListener('load',()=>{
setTimeout(()=>{document.getElementById('loader').classList.add('hidden')},2300);
});
</script>

</body>
</html>
