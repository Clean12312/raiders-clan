<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raiders Clan DE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
  body{background:#0a0a0a;color:#fff}
  .header{text-align:center;padding:50px 20px 30px;border-bottom:1px solid #1a1a1a}
  .header h1{font-size:48px;font-weight:900;letter-spacing:3px}
  .sub{color:#666;margin-top:10px}
  .container{max-width:1100px;margin:0 auto;padding:30px 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
  .card{background:#111;border:1px solid #222;border-radius:16px;overflow:hidden}
  .card img{width:100%;height:240px;object-fit:cover;background:#000;display:block}
  .card-info{padding:16px}
  .title{font-size:22px;font-weight:800;margin:50px 0 20px;display:flex;gap:10px;align-items:center}
  .title::before{content:'';width:4px;height:22px;background:#ff1a1a;border-radius:2px}
  .logs{background:#111;border:1px solid #222;border-radius:16px}
  .log{padding:18px 20px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between}
  .admin{margin-top:50px;background:#111;border:1px solid #222;border-radius:16px;padding:30px;text-align:center}
  .pw{display:flex;gap:10px;justify-content:center;max-width:400px;margin:20px auto 0}
  .pw input{flex:1;background:#0a0a0a;border:1px solid #333;border-radius:10px;padding:12px 16px;color:#fff}
  .pw button{background:#fff;color:#000;border:none;border-radius:10px;padding:12px 24px;font-weight:800;cursor:pointer}
  .discord{display:flex;justify-content:center;margin:25px 0}
  .discord a{background:#5865F2;color:#fff;padding:14px 30px;border-radius:12px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="header">
  <h1>RAIDERS CLAN DE</h1>
  <div class="sub">gerated am 07.09.</div>
  <div class="discord"><a href="https://discord.gg/sJDvdYxzD" target="_blank">Discord beitreten</a></div>
</div>

<div class="container">
  <div class="grid">
    <div class="card"><img src="eh.jpg"><div class="card-info"><h3>EH</h3></div></div>
    <div class="card"><img src="mc.jpg" style="object-fit:contain;background:#000"><div class="card-info"><h3>MC</h3></div></div>
    <div class="card"><img src="raiders_main.jpg"><div class="card-info"><h3>RAIDERS MAIN</h3></div></div>
    <div class="card"><img src="sab.jpg"><div class="card-info"><h3>SAB</h3></div></div>
    <div class="card"><img src="roblox.jpg"><div class="card-info"><h3>ROBLOX</h3></div></div>
    <div class="card"><img src="dc.jpg"><div class="card-info"><h3>DC</h3></div></div>
  </div>

  <div class="title">RAID LOGS</div>
  <div class="logs">
    <div class="log"><span>EH Raid erfolgreich</span><span style="color:#555">07.09. 19:42</span></div>
    <div class="log"><span>MC Gebiet eingenommen</span><span style="color:#555">07.09. 18:30</span></div>
    <div class="log"><span>RAIDERS MAIN - Full Clear</span><span style="color:#555">07.09. 16:15</span></div>
  </div>

  <div class="admin">
    <h2>ADMIN BEREICH</h2>
    <p style="color:#666">Passwort erforderlich</p>
    <div class="pw">
      <input type="password" id="pw" placeholder="Passwort...">
      <button onclick="check()">Unlock</button>
    </div>
    <div id="msg" style="margin-top:15px"></div>
  </div>
</div>

<script>
function check(){
  const v=document.getElementById('pw').value.toLowerCase();
  const m=document.getElementById('msg');
  if(v==='peter'){m.style.color='#00ff88';m.innerHTML='✅ Zugriff gewährt - Admin Modus aktiv';}
  else{m.style.color='#ff1a1a';m.innerHTML='❌ Falsches Passwort';}
}
</script>
</body>
</html>
